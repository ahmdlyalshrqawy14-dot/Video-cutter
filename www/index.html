<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قص نهاية الفيديو</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#f4f5f7;color:#1b1f24;display:flex;justify-content:center;padding:20px}
  main{width:100%;max-width:460px;background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
  h1{font-size:1.3rem;margin:0 0 18px;text-align:center}
  label{display:block;margin-bottom:14px;font-size:.95rem;font-weight:600}
  label small{font-weight:400;color:#667}
  input[type=file],input[type=number],input[type=text]{display:block;width:100%;margin-top:6px;padding:9px;border:1px solid #ccd;border-radius:8px;font-size:1rem;background:#fff}
  button{width:100%;padding:12px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer}
  button:disabled{background:#9ab;cursor:not-allowed}
  .row{display:flex;gap:10px;margin-top:10px}
  .row button{flex:1;font-size:.95rem;padding:10px}
  .sec{background:#64748b}
  #cancelBtn:not(:disabled){background:#dc2626}
  progress{width:100%;margin-top:12px;height:12px}
  #status{min-height:1.4em;margin:10px 0 0;font-size:.85rem;color:#445;text-align:center;white-space:pre-wrap;word-break:break-all}
  #result{margin-top:16px;border-top:1px solid #e3e5e8;padding-top:16px}
  video{width:100%;border-radius:10px;background:#000;margin-bottom:12px}
  #dl{background:#16a34a}
  #shareBtn{background:#7c3aed}
  #sizes{font-size:.85rem;color:#556;text-align:center;margin:10px 0 0}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>✂️ قص نهاية الفيديو</h1>

  <label>١) اختر الفيديو
    <input type="file" id="mainFile" accept="video/*">
  </label>

  <label>٢) احذف آخر كام ثانية؟ <small>(من 2 إلى 10 — مثال: 3.8)</small>
    <input type="number" id="cut" min="2" max="10" step="0.1" value="2">
  </label>

  <label>٣) إضافة لاحقة في النهاية <small>(اختياري — فيديو أو صورة)</small>
    <input type="file" id="extraFile" accept="video/*,image/*">
  </label>

  <label id="imgDurBox" hidden>مدة ظهور الصورة (ثانية)
    <input type="number" id="imgDur" min="1" max="30" step="0.5" value="3">
  </label>

  <button id="startBtn">ابدأ</button>
  <div class="row">
    <button id="cancelBtn" class="sec" disabled>⛔ إلغاء</button>
    <button id="resetBtn" class="sec">🔄 إعادة البدء</button>
  </div>
  <progress id="bar" max="1" value="0" hidden></progress>
  <p id="status"></p>

  <div id="result" hidden>
    <video id="preview" controls playsinline></video>
    <label>اسم الملف قبل التنزيل
      <input type="text" id="name" value="video">
    </label>
    <div class="row">
      <button id="dl">⬇️ تنزيل</button>
      <button id="shareBtn">📤 مشاركة</button>
    </div>
    <p id="sizes"></p>
  </div>
</main>

<script type="module">
import { FFmpeg } from './ffmpeg/ffmpeg-esm/index.js';
import { fetchFile } from './ffmpeg/util-esm/index.js';

const $ = id => document.getElementById(id);
const mainFile = $('mainFile'), extraFile = $('extraFile'), cutEl = $('cut');
const startBtn = $('startBtn'), cancelBtn = $('cancelBtn'), resetBtn = $('resetBtn');
const bar = $('bar'), statusEl = $('status');
const MAX_BYTES = 25 * 1048576;   // الحد الأقصى في حالة إعادة الترميز الاضطرارية
const AUDIO_BR = 128000;

let ffmpeg = null, logBuf = '', outBlob = null;
let running = false, cancelled = false, wantReset = false, engineReady = false;

extraFile.addEventListener('change', () => {
  const f = extraFile.files[0];
  $('imgDurBox').hidden = !(f && f.type.startsWith('image/'));
});

const setStatus = t => statusEl.textContent = t;
const errText = e => (e && e.message) ? e.message : String(e);
const even = n => n - (n % 2);

async function getFF() {
  if (ffmpeg) return ffmpeg;
  const base = new URL('ffmpeg/core-esm/', location.href).href;
  for (const fn of ['ffmpeg-core.js', 'ffmpeg-core.wasm']) {
    const r = await fetch(base + fn);
    if (!r.ok) throw new Error('الملف غير موجود: ' + fn + ' (' + r.status + ')');
  }
  const f = new FFmpeg();
  f.on('log', ({ message }) => { logBuf += message + '\n'; });
  f.on('progress', ({ progress }) => {
    if (progress >= 0 && progress <= 1) bar.value = progress;
  });
  await f.load({
    coreURL: base + 'ffmpeg-core.js',
    wasmURL: base + 'ffmpeg-core.wasm'
  });
  ffmpeg = f;
  return f;
}

function videoMeta(file) {
  return new Promise((res, rej) => {
    const v = document.createElement('video');
    v.preload = 'metadata';
    const url = URL.createObjectURL(file);
    const t = setTimeout(() => { URL.revokeObjectURL(url); rej(new Error('timeout')); }, 8000);
    v.onloadedmetadata = () => {
      clearTimeout(t);
      const m = { duration: v.duration };
      URL.revokeObjectURL(url);
      res(m);
    };
    v.onerror = () => { clearTimeout(t); URL.revokeObjectURL(url); rej(new Error('تعذّر قراءة الفيديو')); };
    v.src = url;
  });
}

const getExt = (f, fallback) => {
  const e = (f.name.split('.').pop() || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  return e || fallback;
};

async function probe(ff, name) {
  logBuf = '';
  try { await ff.exec(['-i', name]); } catch (e) { if (cancelled) throw e; }
  const l = logBuf;
  const vLine = (l.match(/Stream #[^\n]*Video:[^\n]*/) || [''])[0];
  const aLine = (l.match(/Stream #[^\n]*Audio:[^\n]*/) || [''])[0];

  const vcodec = ((vLine.match(/Video:\s*([A-Za-z0-9_]+)/) || [])[1] || '').toLowerCase();
  const acodec = ((aLine.match(/Audio:\s*([A-Za-z0-9_]+)/) || [])[1] || '').toLowerCase();
  const sM = vLine.match(/ (\d{2,5})x(\d{2,5})/);
  const fM = vLine.match(/(\d+(?:\.\d+)?) fps/);
  let fps = fM ? parseFloat(fM[1]) : 30;
  if (!(fps > 0)) fps = 30;
  if (fps > 60) fps = 60;

  const dM = l.match(/Duration: (\d+):(\d+):(\d+(?:\.\d+)?)/);
  const duration = dM ? (+dM[1]) * 3600 + (+dM[2]) * 60 + parseFloat(dM[3]) : 0;

  const srM = aLine.match(/(\d+) Hz/);
  const mono = /mono/i.test(aLine);

  // اتجاه الشاشة (دوران في ملفات الموبايل)
  let cw = 0, m = l.match(/rotation of (-?\d+(?:\.\d+)?) degrees/);
  if (m) cw = (((-Math.round(parseFloat(m[1]) / 90) * 90) % 360) + 360) % 360;
  else { m = l.match(/rotate\s*:\s*(\d+)/); if (m) cw = (Math.round(parseInt(m[1]) / 90) * 90) % 360; }

  return {
    vcodec, acodec,
    audio: !!aLine,
    fps: +fps.toFixed(3),
    duration,
    w: sM ? +sM[1] : 0,
    h: sM ? +sM[2] : 0,
    sr: srM ? +srM[1] : 44100,
    ch: mono ? 1 : 2,
    layout: mono ? 'mono' : 'stereo',
    cw
  };
}

const rotFilter = cw => cw === 90 ? 'transpose=2,' : cw === 270 ? 'transpose=1,' : cw === 180 ? 'hflip,vflip,' : '';

async function run(ff, args, msg) {
  logBuf = '';
  const code = await ff.exec(args);
  if (cancelled) throw new Error('cancelled');
  if (code !== 0) throw new Error((msg || 'فشلت المعالجة') + ' (كود ' + code + ')');
}

function updateButtons() {
  startBtn.disabled = running || !engineReady;
  cancelBtn.disabled = !running;
}

function doCancel() {
  cancelled = true;
  try { if (ffmpeg) ffmpeg.terminate(); } catch (e) {}
  ffmpeg = null;
  engineReady = false;
}

function resetAll() {
  mainFile.value = '';
  extraFile.value = '';
  cutEl.value = '2';
  $('imgDur').value = '3';
  $('imgDurBox').hidden = true;
  const prev = $('preview');
  if (prev.src) { try { URL.revokeObjectURL(prev.src); } catch (e) {} }
  prev.removeAttribute('src'); prev.load();
  outBlob = null;
  $('result').hidden = true;
  $('sizes').textContent = '';
  $('name').value = 'video';
  bar.hidden = true; bar.value = 0;
  setStatus('');
  prepareEngine();
}

async function prepareEngine() {
  if (running) return;
  engineReady = false; updateButtons();
  setStatus('جارٍ تحميل المحرّك...');
  try {
    await getFF();
    engineReady = true;
    setStatus('المحرّك جاهز ✅');
  } catch (e) {
    console.error(e);
    setStatus('❌ تعذّر تحميل المحرّك: ' + errText(e));
  }
  updateButtons();
}

cancelBtn.addEventListener('click', () => {
  if (running) doCancel();
});

resetBtn.addEventListener('click', () => {
  if (running) { wantReset = true; doCancel(); }
  else resetAll();
});

startBtn.addEventListener('click', async () => {
  const file = mainFile.files[0];
  if (!file) return setStatus('اختر فيديو أولًا');
  const cut = parseFloat(cutEl.value);
  if (!(cut >= 2 && cut <= 10)) return setStatus('اكتب رقم بين 2 و 10');

  running = true; cancelled = false; wantReset = false;
  updateButtons();
  $('result').hidden = true;
  bar.hidden = false; bar.value = 0;
  const created = [];
  const mk = n => { created.push(n); return n; };
  let ff = null;

  try {
    setStatus('جارٍ تحميل المحرّك...');
    ff = await getFF();

    setStatus('جارٍ قراءة الملف...');
    const inMain = mk('in0.' + getExt(file, 'mp4'));
    await ff.writeFile(inMain, await fetchFile(file));
    if (cancelled) throw new Error('cancelled');
    const pm = await probe(ff, inMain);

    let duration = pm.duration;
    if (!(duration > 0)) { try { duration = (await videoMeta(file)).duration; } catch (e) {} }
    if (!(duration > 0)) throw new Error('تعذّر قراءة مدة الفيديو');
    if (cut >= duration) throw new Error('المدة المحذوفة أكبر من طول الفيديو');
    const keep = (duration - cut).toFixed(3);

    const extra = extraFile.files[0];

    // ===== بدون لاحقة: قص فقط بدون إعادة ترميز =====
    if (!extra) {
      setStatus('جارٍ القص...');
      await run(ff, ['-i', inMain, '-t', keep, '-map', '0:v:0', '-map', '0:a:0?',
        '-c', 'copy', '-avoid_negative_ts', 'make_zero', '-movflags', '+faststart', mk('out.mp4')]);
    }
    // ===== مع لاحقة =====
    else {
      const isImg = extra.type.startsWith('image/');
      const inExtra = mk('in1.' + getExt(extra, isImg ? 'png' : 'mp4'));
      await ff.writeFile(inExtra, await fetchFile(extra));
      if (cancelled) throw new Error('cancelled');

      const h264 = pm.vcodec === 'h264';
      const aacCopy = pm.acodec === 'aac';
      const sr = (pm.audio && aacCopy) ? pm.sr : 44100;
      const ch = pm.audio ? pm.ch : 2;
      const layout = ch === 1 ? 'mono' : 'stereo';
      const fps = pm.fps;
      const audioEnc = ['-c:a', 'aac', '-b:a', '128k', '-ar', String(sr), '-ac', String(ch)];

      let part0Args, cwOut, sw, sh, dW, dH;

      if (h264) {
        cwOut = pm.cw;
        sw = even(pm.w); sh = even(pm.h);
        if (!sw || !sh) throw new Error('تعذّر قراءة مقاس الفيديو');
        part0Args = ['-i', inMain, '-t', keep, '-map', '0:v:0', ...(pm.audio ? ['-map', '0:a:0'] : []),
          '-c:v', 'copy', '-bsf:v', 'h264_mp4toannexb',
          ...(pm.audio ? (aacCopy ? ['-c:a', 'copy'] : audioEnc) : ['-an']),
          '-f', 'mpegts', mk('part0.ts')];
      } else {
        const swap = pm.cw === 90 || pm.cw === 270;
        cwOut = 0;
        sw = even(swap ? pm.h : pm.w); sh = even(swap ? pm.w : pm.h);
        if (!sw || !sh) throw new Error('تعذّر قراءة مقاس الفيديو');
        const target = Math.min(file.size, MAX_BYTES) * 8 / duration;
        const vk = Math.max(300, Math.round((target - (pm.audio ? AUDIO_BR : 0)) * 0.9 / 1000));
        setStatus('الفيديو بصيغة غير H.264، هيتم تحويله (أبطأ)...');
        part0Args = ['-i', inMain, '-t', keep, '-map', '0:v:0', ...(pm.audio ? ['-map', '0:a:0'] : []),
          '-vf', 'scale=' + sw + ':' + sh + ',format=yuv420p',
          '-c:v', 'libx264', '-preset', 'veryfast', '-b:v', vk + 'k', '-maxrate', Math.round(vk * 1.5) + 'k', '-bufsize', (vk * 2) + 'k',
          ...(pm.audio ? audioEnc : ['-an']),
          '-f', 'mpegts', mk('part0.ts')];
      }
      const swapOut = cwOut === 90 || cwOut === 270;
      dW = swapOut ? sh : sw; dH = swapOut ? sw : sh;

      if (h264) setStatus('جارٍ قص الفيديو الأصلي (بدون إعادة ترميز)...');
      bar.value = 0;
      await run(ff, part0Args, 'فشل قص الفيديو');

      setStatus('جارٍ تجهيز اللاحقة...');
      const vf = `scale=${dW}:${dH}:force_original_aspect_ratio=decrease,pad=${dW}:${dH}:(ow-iw)/2:(oh-ih)/2,setsar=1,${rotFilter(cwOut)}fps=${fps},format=yuv420p`;
      const vbrCap = Math.max(500, Math.round((file.size * 8 / duration) / 1000));
      const venc = ['-c:v', 'libx264', '-preset', 'veryfast', '-profile:v', 'high', '-crf', '23',
        '-maxrate', vbrCap + 'k', '-bufsize', (vbrCap * 2) + 'k', '-g', String(Math.round(fps * 2)), '-r', String(fps)];

      let extraDur, part1Args;
      if (isImg) {
        extraDur = Math.max(1, parseFloat($('imgDur').value) || 3);
        part1Args = ['-loop', '1', '-framerate', String(fps), '-t', extraDur.toFixed(3), '-i', inExtra];
        if (pm.audio) part1Args.push('-f', 'lavfi', '-t', extraDur.toFixed(3), '-i', `anullsrc=r=${sr}:cl=${layout}`);
        part1Args.push('-map', '0:v', ...(pm.audio ? ['-map', '1:a'] : []), '-vf', vf, ...venc,
          ...(pm.audio ? ['-c:a', 'aac', '-b:a', '128k', '-ar', String(sr), '-ac', String(ch)] : ['-an']),
          '-f', 'mpegts', mk('part1.ts'));
      } else {
        const pe = await probe(ff, inExtra);
        extraDur = pe.duration;
        if (!(extraDur > 0)) { try { extraDur = (await videoMeta(extra)).duration; } catch (e) {} }
        if (!(extraDur > 0)) throw new Error('تعذّر قراءة مدة الفيديو الإضافي');
        part1Args = ['-i', inExtra];
        const needSilence = pm.audio && !pe.audio;
        if (needSilence) part1Args.push('-f', 'lavfi', '-t', extraDur.toFixed(3), '-i', `anullsrc=r=${sr}:cl=${layout}`);
        part1Args.push('-map', '0:v:0',
          ...(pm.audio ? (needSilence ? ['-map', '1:a'] : ['-map', '0:a:0']) : []),
          '-vf', vf, ...venc,
          ...(pm.audio ? ['-c:a', 'aac', '-b:a', '128k', '-ar', String(sr), '-ac', String(ch)] : ['-an']),
          '-f', 'mpegts', mk('part1.ts'));
      }
      bar.value = 0;
      await run(ff, part1Args, 'فشل تجهيز اللاحقة');

      setStatus('جارٍ الدمج...');
      await ff.writeFile(mk('list.txt'), 'file part0.ts\nfile part1.ts\n');
      await run(ff, ['-f', 'concat', '-safe', '0', '-i', 'list.txt', '-c', 'copy',
        ...(pm.audio ? ['-bsf:a', 'aac_adtstoasc'] : []),
        ...(cwOut ? ['-metadata:s:v:0', 'rotate=' + cwOut] : []),
        '-movflags', '+faststart', mk('out.mp4')], 'فشل الدمج');
    }

    const data = await ff.readFile('out.mp4');
    outBlob = new Blob([data.buffer], { type: 'video/mp4' });

    const prev = $('preview');
    if (prev.src) { try { URL.revokeObjectURL(prev.src); } catch (e) {} }
    prev.src = URL.createObjectURL(outBlob);

    const mb = b => (b / 1048576).toFixed(2) + ' MB';
    $('sizes').textContent = `الحجم الأصلي: ${mb(file.size)} ← الناتج: ${mb(outBlob.size)}`;
    $('name').value = file.name.replace(/\.[^.]+$/, '') + '-edited';
    $('result').hidden = false;
    bar.value = 1;
    setStatus('تم ✅ اكتب الاسم ثم نزّل الملف أو شاركه');
  } catch (e) {
    if (cancelled) {
      if (!wantReset) setStatus('تم الإلغاء ⛔');
      bar.hidden = true;
    } else {
      console.error(e);
      const tail = logBuf.split('\n').filter(Boolean).slice(-6).join('\n');
      setStatus('❌ ' + errText(e) + (tail ? '\n' + tail : ''));
    }
  } finally {
    if (!cancelled && ffmpeg) for (const n of created) { try { await ffmpeg.deleteFile(n); } catch (e) {} }
    running = false;
    const doReset = wantReset;
    wantReset = false;
    if (cancelled) {
      cancelled = false;
      if (doReset) resetAll(); else prepareEngine();
    }
    updateButtons();
  }
});

// ===== الحفظ والمشاركة =====
const fileName = () => ($('name').value.trim().replace(/[\\/:*?"<>|]/g, '') || 'video') + '.mp4';
const isNative = () => { const c = window.Capacitor; return !!(c && c.isNativePlatform && c.isNativePlatform()); };

async function writeBlob(Filesystem, blob, path, directory) {
  const CH = 3 * 1024 * 1024;   // مضاعف 3 عشان الـ base64 يتجمّع صح
  let uri = null;
  for (let o = 0; o < blob.size; o += CH) {
    const b64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(blob.slice(o, o + CH));
    });
    if (o === 0) {
      const r = await Filesystem.writeFile({ path, data: b64, directory, recursive: true });
      uri = r.uri;
    } else {
      await Filesystem.appendFile({ path, data: b64, directory });
    }
  }
  return uri;
}

function browserDownload(n) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(outBlob);
  a.download = n;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

let saving = false;

$('dl').addEventListener('click', async () => {
  if (!outBlob || saving) return;
  const n = fileName();
  if (!isNative()) return browserDownload(n);

  saving = true;
  try {
    setStatus('جارٍ الحفظ...');
    const { Filesystem } = window.Capacitor.Plugins;
    try { await Filesystem.requestPermissions(); } catch (e) {}
    const tries = [
      ['EXTERNAL_STORAGE', 'Download/' + n, 'Download'],
      ['DOCUMENTS', n, 'Documents']
    ];
    let saved = null, lastErr = null;
    for (const [dir, path, label] of tries) {
      try { await writeBlob(Filesystem, outBlob, path, dir); saved = label; break; }
      catch (e) { lastErr = e; }
    }
    if (!saved) throw lastErr || new Error('فشل الحفظ');
    setStatus('تم الحفظ في مجلد ' + saved + ' ✅\n' + n);
  } catch (e) {
    console.error(e);
    setStatus('❌ فشل الحفظ: ' + errText(e));
  } finally { saving = false; }
});

$('shareBtn').addEventListener('click', async () => {
  if (!outBlob || saving) return;
  const n = fileName();

  if (!isNative()) {
    try {
      const f = new File([outBlob], n, { type: 'video/mp4' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: n }); return; }
    } catch (e) {}
    return browserDownload(n);
  }

  saving = true;
  try {
    setStatus('جارٍ تجهيز الملف للمشاركة...');
    const { Filesystem, Share } = window.Capacitor.Plugins;
    const uri = await writeBlob(Filesystem, outBlob, n, 'CACHE');
    await Share.share({ title: n, files: [uri] });
    setStatus('تم ✅');
  } catch (e) {
    console.error(e);
    setStatus('❌ ' + errText(e));
  } finally { saving = false; }
});

prepareEngine();
</script>
</body>
</html>
