name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save @ffmpeg/ffmpeg@0.12.10 @ffmpeg/util@0.12.1 @ffmpeg/core@0.12.6

      - name: Copy FFmpeg engine into the app
        run: |
          mkdir -p www/ffmpeg/core-esm
          cp -r node_modules/@ffmpeg/ffmpeg/dist/esm www/ffmpeg/ffmpeg-esm
          cp -r node_modules/@ffmpeg/util/dist/esm www/ffmpeg/util-esm
          cp node_modules/@ffmpeg/core/dist/esm/ffmpeg-core.js www/ffmpeg/core-esm/
          cp node_modules/@ffmpeg/core/dist/esm/ffmpeg-core.wasm www/ffmpeg/core-esm/
          ls -lh www/ffmpeg/*

      - name: Add Android platform
        run: |
          npx cap add android
          sed -i 's/<application/<application android:largeHeap="true" android:requestLegacyExternalStorage="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: video-trimmer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
